name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Microsoft.Azure.NotificationHubs.sln -c Release -p:GeneratePackageOnBuild=false
      - run: dotnet test Microsoft.Azure.NotificationHubs.sln -c Release --no-build
